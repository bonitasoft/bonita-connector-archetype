version: 2

updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"

  # Maintain dependencies for maven
  - package-ecosystem: "maven"
    directory: "/"
    exclude-paths:
      - "src/test/resources/**"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
